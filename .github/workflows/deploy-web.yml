name: Deploy Marketplace Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Build Next.js standalone
        working-directory: apps/web
        run: pnpm run build

      - name: Inspect Next.js manifests
        working-directory: apps/web
        run: |
          echo "=== .next/server ==="
          find .next/server -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "=== .next/standalone ==="
          find .next/standalone -maxdepth 5 -type f | sort | head -200

          echo ""
          echo "=== manifests ==="
          find .next -type f \
            \( \
              -name '*manifest*.json' \
              -o -name 'pages-manifest.json' \
            \) \
            -print | sort

          echo ""
          echo "=== pages-manifest checks ==="

          if [ -f ".next/server/pages-manifest.json" ]; then
            echo "FOUND: .next/server/pages-manifest.json"
          else
            echo "MISSING: .next/server/pages-manifest.json"
          fi

          if [ -f ".next/standalone/.next/server/pages-manifest.json" ]; then
            echo "FOUND: .next/standalone/.next/server/pages-manifest.json"
          else
            echo "MISSING: .next/standalone/.next/server/pages-manifest.json"
          fi

      - name: Build Cloudflare Worker
        working-directory: apps/web
        run: pnpm run cf:build
        env:
          NEXT_PRIVATE_BUILD_WORKER: "1"

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}