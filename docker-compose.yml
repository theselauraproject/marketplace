services:
  postgres:
    image: postgres:17-alpine
    container_name: selaura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: selaura
      POSTGRES_PASSWORD: selaura
      POSTGRES_DB: selaura
    ports:
      - "5432:5432"
    volumes:
      - selaura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selaura -d selaura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  selaura-pgdata:
